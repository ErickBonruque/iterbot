name: Deploy IterBot to EC2

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rollback:
        description: 'Set to "true" to rollback instead of deploy'
        required: false
        default: 'false'
      commit:
        description: 'Commit hash to rollback to (optional, defaults to previous)'
        required: false

jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: iterbot_test
          POSTGRES_USER: iterbot_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install poetry

      - run: poetry install --with dev

      - name: Lint
        run: poetry run ruff check .

      - name: Format check
        run: poetry run ruff format --check .

      - name: Tests
        run: poetry run pytest --cov -v
        env:
          DATABASE_URL: postgresql://iterbot_user:test_password@localhost:5432/iterbot_test
          REDIS_URL: redis://localhost:6379/0

  deploy:
    needs: ci
    if: github.event.inputs.rollback != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ***REMOVED*** \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ubuntu bash -euo pipefail -c \"cd /home/ubuntu/iterbot && git fetch origin master && git reset --hard origin/master && mkdir -p secrets/users && if [ ! -f secrets/users/admin-users.txt ] || [ ! -f secrets/users/waha-users.txt ]; then set -a && . ./.env && set +a && bash ./deployment/scripts/setup-htpasswd.sh; fi && grep -q ^EMAIL_PROVIDER .env && sed -i 's/^EMAIL_PROVIDER=.*/EMAIL_PROVIDER=ses/' .env || echo 'EMAIL_PROVIDER=ses' >> .env && grep -q ^DEFAULT_FROM_EMAIL .env && sed -i 's/^DEFAULT_FROM_EMAIL=.*/DEFAULT_FROM_EMAIL=***REMOVED***/' .env || echo 'DEFAULT_FROM_EMAIL=***REMOVED***' >> .env && grep -q ^DOMAIN .env && sed -i 's|^DOMAIN=.*|DOMAIN=98-81-236-180.sslip.io|' .env || echo 'DOMAIN=98-81-236-180.sslip.io' >> .env && grep -q ^PORTAL_BASE_URL .env && sed -i 's|^PORTAL_BASE_URL=.*|PORTAL_BASE_URL=https://98-81-236-180.sslip.io|' .env || echo 'PORTAL_BASE_URL=https://98-81-236-180.sslip.io' >> .env && grep -q ^ALLOWED_HOSTS .env && sed -i 's|^ALLOWED_HOSTS=.*|ALLOWED_HOSTS=98-81-236-180.sslip.io,www.98-81-236-180.sslip.io,waha.98-81-236-180.sslip.io,backend|' .env || echo 'ALLOWED_HOSTS=98-81-236-180.sslip.io,www.98-81-236-180.sslip.io,waha.98-81-236-180.sslip.io,backend' >> .env && set -a && . ./.env && set +a && mkdir -p secrets && printf '%s' \"$AWS_ACCESS_KEY_ID\" > secrets/aws_access_key_id.txt && printf '%s' \"$AWS_SECRET_ACCESS_KEY\" > secrets/aws_secret_access_key.txt && docker container prune -f && docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d --remove-orphans && docker image prune -f && bash ./deployment/scripts/smoke-check.sh && echo Deploy concluido em $(date -Iseconds)\""]' \
            --comment "Deploy from GitHub Actions run ${{ github.run_id }}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Aguarda até 10 minutos
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ***REMOVED*** \
              --query 'Status' --output text)
            echo "[$i/60] Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deploy concluido com sucesso"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id ***REMOVED*** \
                --query 'StandardOutputContent' --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deploy falhou com status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id ***REMOVED*** \
                --query '[StandardOutputContent, StandardErrorContent]' --output json
              exit 1
            fi
          done

          echo "Timeout aguardando SSM command"
          exit 1

  rollback:
    needs: ci
    if: github.event.inputs.rollback == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Rollback via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ***REMOVED*** \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ubuntu bash -euo pipefail -c \"cd /home/ubuntu/iterbot && bash ./deployment/scripts/rollback.sh --commit ${{ github.event.inputs.commit }} && echo Rollback concluido em $(date -Iseconds)\""]' \
            --comment "Rollback from GitHub Actions run ${{ github.run_id }}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ***REMOVED*** \
              --query 'Status' --output text)
            echo "[$i/60] Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Rollback concluido com sucesso"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id ***REMOVED*** \
                --query 'StandardOutputContent' --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Rollback falhou com status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id ***REMOVED*** \
                --query '[StandardOutputContent, StandardErrorContent]' --output json
              exit 1
            fi
          done

          echo "Timeout aguardando rollback SSM command"
          exit 1