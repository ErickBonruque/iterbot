name: Debug — coletar logs do backend (ad-hoc)

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run SSM command to fetch logs
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ***REMOVED*** \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ubuntu bash -c \"cd /home/ubuntu/iterbot && echo === .env EMAIL vars === && grep -E ^EMAIL .env && echo === secrets brevo === && ls -la secrets/brevo_api_key.txt 2>&1 && echo === backend logs --tail 80 === && docker logs iterbot_backend --tail 80 2>&1\""]' \
            --query 'Command.CommandId' --output text)
          echo "SSM Command: $COMMAND_ID"
          for i in $(seq 1 30); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id ***REMOVED*** --query 'Status' --output text)
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ]; then
              echo "=== STDOUT ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id ***REMOVED*** --query 'StandardOutputContent' --output text
              echo "=== STDERR ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id ***REMOVED*** --query 'StandardErrorContent' --output text
              break
            fi
          done
