http:
  middlewares:
    # Security headers
    security-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"

    # Rate limiting
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s

    # BasicAuth for WAHA Dashboard
    waha-auth:
      basicauth:
        usersFile: /etc/traefik/users/waha-users.txt
        realm: "WAHA Dashboard"

    # BasicAuth for Django Admin/Portal
    admin-auth:
      basicauth:
        usersFile: /etc/traefik/users/admin-users.txt
        realm: "IterBot Admin"
