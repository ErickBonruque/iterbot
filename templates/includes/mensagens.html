{# Mensagens do Django como alertas do Bootstrap; "error" vira "danger" (classe que o Bootstrap conhece). #}
{% for message in messages %}
<div class="alert alert-{% if message.level_tag == 'error' %}danger{% elif message.level_tag == 'debug' %}secondary{% else %}{{ message.level_tag|default:'info' }}{% endif %} alert-dismissible fade show" role="alert">
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar aviso"></button>
</div>
{% endfor %}
