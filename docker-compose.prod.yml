# ============================================================================
# IterBot - Docker Compose Production Override
# ============================================================================
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================================

services:
  traefik:
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    # Portas publicas herdadas do base (80, 443). Dashboard 8080 intencionalmente
    # ausente do base — em prod nao ha dashboard exposto.
    volumes:
      - ./infra/traefik/traefik.prod.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./secrets/users:/etc/traefik/users:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    # Backend nao expoe portas publicamente em producao — herdado do base (ja sem ports).
    # Traefik roteia via rede interna Docker (172.20.0.0/16).
    labels:
      - "traefik.enable=true"
      # Declara service explicitamente para evitar ambiguidade com múltiplos services
      - "traefik.http.routers.backend-secure.service=backend"
      # certResolver explicito — backend-secure tem tls=true (do compose base),
      # mas sem certResolver o Traefik v3 nao resolve certificado e descarta o router.
      # Routers COM tls=true precisam de certResolver proprio (fallback do entrypoint
      # nao se aplica quando tls esta explicitamente habilitado no router).
      - "traefik.http.routers.backend-secure.tls.certresolver=letsencrypt"
      # Aplica rate-limit geral e security-headers no backend publico
      - "traefik.http.routers.backend-secure.middlewares=security-headers@file,rate-limit@file"
      # Router dedicado para rotas de login — rate-limit agressivo contra brute force
      - "traefik.http.routers.login-secure.rule=Host(`${DOMAIN}`) && (PathPrefix(`/accounts/login`) || PathPrefix(`/empresas/login`) || PathPrefix(`/accounts/password/reset`))"
      - "traefik.http.routers.login-secure.entrypoints=websecure"
      - "traefik.http.routers.login-secure.tls=true"
      - "traefik.http.routers.login-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.login-secure.middlewares=security-headers@file,login-rate-limit@file"
      - "traefik.http.routers.login-secure.priority=110"
      - "traefik.http.routers.login-secure.service=backend"
      # Router dedicado para admin e empresas — BasicAuth + rate-limit restrito
      - "traefik.http.routers.admin-secure.rule=Host(`${DOMAIN}`) && (PathPrefix(`/admin`) || PathPrefix(`/empresas`))"
      - "traefik.http.routers.admin-secure.entrypoints=websecure"
      - "traefik.http.routers.admin-secure.tls=true"
      - "traefik.http.routers.admin-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.admin-secure.middlewares=admin-auth@file,security-headers@file,admin-rate-limit@file"
      - "traefik.http.routers.admin-secure.priority=100"
      - "traefik.http.routers.admin-secure.service=backend"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    environment:
      - DJANGO_SETTINGS_MODULE=waha_bot.settings.production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  waha:
    # WAHA e servico INTERNO em producao — sem rota Traefik nem subdominio
    # publico (nao depende de registro DNS waha.${DOMAIN}).
    # Porta 3000 bindada apenas no loopback do host para permitir acesso ao
    # dashboard (scan de QR code, gerenciamento de sessao) via tunel SSH:
    #   ssh -L 3000:localhost:3000 <usuario>@<host>
    #   -> abrir http://localhost:3000/dashboard no navegador local
    # O loopback bind nao e alcancavel externamente (firewall/SG nem precisa
    # da porta 3000 — o bind em 127.0.0.1 ja restringe ao proprio host).
    ports:
      - "127.0.0.1:3000:3000"
    labels:
      - "traefik.enable=false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Celery Worker - Executa tasks do beat (review semanal, health check)
  # ==========================================================================
  celery_worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: iterbot_celery_worker
    restart: unless-stopped
    command: celery -A waha_bot worker -l info --concurrency=1 --without-gossip --without-mingle
    env_file:
      - .env
    secrets:
      - django_secret_key
      - email_password
      - postgres_password
      - aws_access_key_id
      - aws_secret_access_key
      - brevo_api_key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web
    labels:
      - "traefik.enable=false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Celery Beat - Scheduler que dispara tasks periodicamente
  # ==========================================================================
  celery_beat:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: iterbot_celery_beat
    restart: unless-stopped
    command: celery -A waha_bot beat -l info --schedule=/app/celerybeat-schedule
    env_file:
      - .env
    secrets:
      - django_secret_key
      - email_password
      - postgres_password
      - aws_access_key_id
      - aws_secret_access_key
      - brevo_api_key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - celerybeat_data:/app
    networks:
      - web
    labels:
      - "traefik.enable=false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================================
# Volumes - Production-only volumes
# ============================================================================
volumes:
  traefik_certs:
    driver: local
  celerybeat_data:
    driver: local
