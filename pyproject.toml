[tool.poetry]
name = "iterbot-utfpr"
version = "0.1.0"
description = "Assistente de WhatsApp para estudantes da UTFPR"
authors = ["IterBot Team"]
readme = "README.md"
packages = [{include = "apps"}, {include = "config"}, {include = "infra"}, {include = "waha_bot"}]

[tool.poetry.dependencies]
python = "^3.11"
django = ">=5.2.11,<6"
django-allauth = "^0.57.0"
djangorestframework = "^3.14.0"
django-filter = "^23.0"
requests = "^2.31.0"
python-jobspy = "^1.1.0"
pandas = "^2.1.0"
gunicorn = "^21.2.0"
whitenoise = "^6.7.0"
psycopg2-binary = "^2.9.9"
django-environ = "^0.11.2"
dj-database-url = "^2.1.0"
celery = "^5.3.4"
redis = "^5.0.1"
structlog = "^24.1.0"
pydantic = "^2.5.0"
cryptography = "^41.0.7"
python-statemachine = "^2.1.2"
validate-docbr = "^1.10.0"
django-unfold = "^0.90.0"
django-ses = "^4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-django = "^4.7.0"
pytest-mock = "^3.12.0"
pytest-cov = "^4.1.0"
black = "^23.12.0"
ruff = "^0.14.0"
mypy = "^1.7.1"
factory-boy = "^3.3.0"
faker = "^20.1.0"
responses = "^0.24.1"
django-stubs = "^4.2.7"
types-requests = "^2.31.0"
pre-commit = "^4.5.1"
commitizen = "^4.13.10"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH", "C901", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"waha_bot/settings/*.py" = ["E402"]
"**/models.py" = ["RUF012"]
"**/models/*.py" = ["RUF012"]
"**/admin.py" = ["RUF012"]
"**/admin/*.py" = ["RUF012"]
"**/serializers.py" = ["RUF012"]
"**/api_views.py" = ["RUF012"]
"**/forms.py" = ["RUF012"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["apps", "infra", "config", "waha_bot"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "waha_bot.settings.development"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_provider = "commitizen"
version_scheme = "pep440"
tag_format = "$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "waha_bot.settings.development"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --strict-markers --cov=apps/bot --cov=waha_bot --cov-report=term-missing --cov-report=html --cov-report=xml --cov-report=lcov"
testpaths = ["apps"]

[tool.coverage.run]
source = ["apps", "config", "infra", "waha_bot"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
show_contexts = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
